<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Cena final</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 13px system-ui, sans-serif;
        color: #bdbdbd;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .controls {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgb(0 0 0 / 60%);
      }
      input {
        width: min(40vw, 320px);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        background: #8b4dff;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div class="controls">
      <label for="form">Formação</label>
      <input id="form" type="range" min="0" max="1" step="0.001" value="0" />
      <button id="replay" type="button">Rever</button>
    </div>
    <script type="module" src="./finale.ts"></script>
  </body>
</html>
